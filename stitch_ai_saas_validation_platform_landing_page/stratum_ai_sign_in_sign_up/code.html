<!-- Dynamic Logic Script -->
<script>
    function setAuthMode(mode) {
      const tabSignIn = document.getElementById('tab-signin');
      const tabSignUp = document.getElementById('tab-signup');
      const submitCta = document.getElementById('submit-cta');
      const forgotLink = document.getElementById('forgot-link');

      if (mode === 'signup') {
        tabSignUp.className = 'flex-1 py-1.5 rounded-full font-label-md text-label-md text-on-surface font-semibold bg-surface-container-high shadow-sm transition-all duration-200 text-center';
        tabSignIn.className = 'flex-1 py-1.5 rounded-full font-label-md text-label-md text-on-surface-variant hover:text-on-surface transition-all duration-200 text-center';
        submitCta.innerHTML = '<span>Create founder account</span><span class="material-symbols-outlined text-[18px]">arrow_forward</span>';
        if (forgotLink) forgotLink.classList.add('hidden');
      } else {
        tabSignIn.className = 'flex-1 py-1.5 rounded-full font-label-md text-label-md text-on-surface font-semibold bg-surface-container-high shadow-sm transition-all duration-200 text-center';
        tabSignUp.className = 'flex-1 py-1.5 rounded-full font-label-md text-label-md text-on-surface-variant hover:text-on-surface transition-all duration-200 text-center';
        submitCta.innerHTML = '<span>Sign in to workspace</span><span class="material-symbols-outlined text-[18px]">arrow_forward</span>';
        if (forgotLink) forgotLink.classList.remove('hidden');
      }
    }

    function togglePasswordVisibility() {
      const pwd = document.getElementById('password');
      const icon = document.getElementById('eye-icon');
      if (pwd.type === 'password') {
        pwd.type = 'text';
        icon.textContent = 'visibility_off';
      } else {
        pwd.type = 'password';
        icon.textContent = 'visibility';
      }
    }
  </script>
